<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Attendance Tracker</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body class="login-page">

    <div class="login-container">

        <h1>Attendance Tracker</h1>

        <p class="subtitle">
            Student & Instructor Portal
        </p>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <div class="demo-login">

            <p><strong>Demo Accounts</strong></p>

            <p>
                Student: student@test.com
            </p>

            <p>
                Instructor: instructor@test.com
            </p>

            <p>
                Password: 1234
            </p>

        </div>

    </div>

    <script src="/js/app.js"></script>

</body>

</html>
