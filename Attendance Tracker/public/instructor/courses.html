
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses | Attendance Tracker</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .courses-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .courses-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .courses-header h2 {
            margin-bottom: 5px;
        }

        .courses-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .courses-toolbar input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .courses-toolbar select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .courses-table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            padding: 15px;
        }

        .courses-table {
            width: 100%;
            border-collapse: collapse;
        }

        .courses-table th,
        .courses-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e5e5;
        }

        .courses-table th {
            background: #f3f5f8;
        }

        .course-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .course-actions button,
        .primary-button {
            padding: 9px 13px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .primary-button {
            background: #174ea6;
            color: white;
        }

        .secondary-button {
            background: #e8edf5;
            color: #222;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            color: #222;
            width: 100%;
            max-width: 480px;
            padding: 25px;
            border-radius: 10px;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .status-message {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Attendance Tracker</h1>

        <nav>
            <a href="/instructor/dashboard.html">Dashboard</a>
            <a href="/instructor/courses.html" aria-current="page">My Courses</a>
            <a href="/instructor/students.html">Students</a>
            <a href="/instructor/attendance.html">Attendance</a>
            <a href="/instructor/reports.html">Reports</a>
            <button type="button" onclick="logout()">Logout</button>
        </nav>
    </header>

    <main class="courses-container">
        <div class="courses-header">
            <div>
                <h2>My Courses</h2>
                <p>View and manage your courses.</p>
            </div>

            <button type="button" class="primary-button"
                    onclick="openCourseForm()">
                + Add Course
            </button>
        </div>

        <p id="statusMessage" class="status-message" role="status"></p>

        <div class="courses-toolbar">
            <input
                type="search"
                id="searchInput"
                placeholder="Search by course code or name..."
                aria-label="Search courses"
            >

            <select id="termFilter" aria-label="Filter by semester">
                <option value="">All semesters</option>
                <option value="Fall 2026">Fall 2026</option>
                <option value="Spring 2027">Spring 2027</option>
                <option value="Summer 2027">Summer 2027</option>
            </select>
        </div>

        <section class="courses-table-wrapper">
            <table class="courses-table">
                <thead>
                    <tr>
                        <th>Course Code</th>
                        <th>Course Name</th>
                        <th>Semester</th>
                        <th>Students</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="coursesTableBody"></tbody>
            </table>

            <p id="emptyMessage" class="empty-message" hidden>
                No courses found. Select "Add Course" to create one.
            </p>
        </section>
    </main>

    <div class="modal" id="courseModal" role="dialog"
         aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <h2 id="modalTitle">Add Course</h2>

            <form id="courseForm">
                <input type="hidden" id="courseId">

                <div class="form-group">
                    <label for="courseCode">Course Code</label>
                    <input id="courseCode" type="text"
                           placeholder="e.g. CSCE 3444" required>
                </div>

                <div class="form-group">
                    <label for="courseName">Course Name</label>
                    <input id="courseName" type="text"
                           placeholder="e.g. Software Engineering"
                           required>
                </div>

                <div class="form-group">
                    <label for="courseTerm">Semester</label>
                    <select id="courseTerm" required>
                        <option value="">Select semester</option>
                        <option value="Fall 2026">Fall 2026</option>
                        <option value="Spring 2027">Spring 2027</option>
                        <option value="Summer 2027">Summer 2027</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="secondary-button"
                            onclick="closeCourseForm()">
                        Cancel
                    </button>

                    <button type="submit" class="primary-button">
                        Save Course
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "attendanceTrackerCourses";

        const defaultCourses = [
            {
                id: "1",
                code: "CSCE 3444",
                name: "Software Engineering",
                term: "Fall 2026",
                students: 30
            },
            {
                id: "2",
                code: "CSCE 3110",
                name: "Data Structures",
                term: "Fall 2026",
                students: 28
            },
            {
                id: "3",
                code: "CSCE 3600",
                name: "Systems Programming",
                term: "Fall 2026",
                students: 27
            }
        ];

        let courses = loadCourses();

        const tableBody = document.getElementById("coursesTableBody");
        const emptyMessage = document.getElementById("emptyMessage");
        const searchInput = document.getElementById("searchInput");
        const termFilter = document.getElementById("termFilter");
        const courseModal = document.getElementById("courseModal");
        const courseForm = document.getElementById("courseForm");
        const statusMessage = document.getElementById("statusMessage");

        function loadCourses() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved !== null) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch (error) {
                console.error("Could not load saved courses:", error);
            }

            return defaultCourses;
        }

        function saveCourses() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
        }

        function showStatus(message) {
            statusMessage.textContent = message;
        }

        function renderCourses() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const selectedTerm = termFilter.value;

            const filteredCourses = courses.filter(course => {
                const matchesSearch =
                    course.code.toLowerCase().includes(searchTerm) ||
                    course.name.toLowerCase().includes(searchTerm);

                const matchesTerm =
                    !selectedTerm || course.term === selectedTerm;

                return matchesSearch && matchesTerm;
            });

            tableBody.replaceChildren();

            filteredCourses.forEach(course => {
                const row = document.createElement("tr");

                const values = [
                    course.code,
                    course.name,
                    course.term,
                    String(course.students ?? 0)
                ];

                values.forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionsCell = document.createElement("td");
                const actions = document.createElement("div");
                actions.className = "course-actions";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "secondary-button";
                editButton.textContent = "Edit";
                editButton.addEventListener("click", () => editCourse(course.id));

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "secondary-button";
                deleteButton.textContent = "Delete";
                deleteButton.addEventListener("click", () => deleteCourse(course.id));

                actions.append(editButton, deleteButton);
                actionsCell.appendChild(actions);
                row.appendChild(actionsCell);
                tableBody.appendChild(row);
            });

            emptyMessage.hidden = filteredCourses.length > 0;
        }

        function openCourseForm(course = null) {
            courseForm.reset();
            document.getElementById("courseId").value = course?.id ?? "";
            document.getElementById("modalTitle").textContent =
                course ? "Edit Course" : "Add Course";

            if (course) {
                document.getElementById("courseCode").value = course.code;
                document.getElementById("courseName").value = course.name;
                document.getElementById("courseTerm").value = course.term;
            }

            courseModal.style.display = "flex";
            document.getElementById("courseCode").focus();
        }

        function closeCourseForm() {
            courseModal.style.display = "none";
        }

        function editCourse(id) {
            const course = courses.find(item => item.id === id);
            if (course) openCourseForm(course);
        }

        function deleteCourse(id) {
            const course = courses.find(item => item.id === id);
            if (!course) return;

            if (!confirm(`Delete ${course.code} — ${course.name}?`)) return;

            courses = courses.filter(item => item.id !== id);
            saveCourses();
            renderCourses();
            showStatus("Course deleted.");
        }

        courseForm.addEventListener("submit", event => {
            event.preventDefault();

            const id = document.getElementById("courseId").value;
            const code = document.getElementById("courseCode").value.trim().toUpperCase();
            const name = document.getElementById("courseName").value.trim();
            const term = document.getElementById("courseTerm").value;

            if (!code || !name || !term) return;

            const duplicate = courses.some(course =>
                course.code.toLowerCase() === code.toLowerCase() &&
                course.id !== id
            );

            if (duplicate) {
                showStatus("A course with that code already exists.");
                return;
            }

            if (id) {
                courses = courses.map(course =>
                    course.id === id
                        ? { ...course, code, name, term }
                        : course
                );
                showStatus("Course updated.");
            } else {
                courses.push({
                    id: crypto.randomUUID(),
                    code,
                    name,
                    term,
                    students: 0
                });
                showStatus("Course added.");
            }

            saveCourses();
            renderCourses();
            closeCourseForm();
        });

        searchInput.addEventListener("input", renderCourses);
        termFilter.addEventListener("change", renderCourses);

        courseModal.addEventListener("click", event => {
            if (event.target === courseModal) closeCourseForm();
        });

        function logout() {
            localStorage.removeItem("user");
            window.location.href = "/";
        }

        renderCourses();
    </script>
</body>
</html>
