<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard | Course Attendance System</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .dashboard-container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            margin-bottom: 10px;
        }

        .dashboard-header p {
            margin: 8px 0;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
            margin: 30px 0;
        }

        .dashboard-card,
        .content-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .dashboard-card {
            text-align: center;
        }

        .dashboard-card h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .dashboard-number {
            font-size: 32px;
            font-weight: bold;
            margin: 0;
        }

        .content-section {
            margin-bottom: 24px;
        }

        .content-section h2 {
            margin-top: 0;
        }

        .course-select {
            width: 100%;
            max-width: 650px;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            background: white;
        }

        .course-details {
            line-height: 1.8;
        }

        .status-message {
            margin: 15px 0;
        }

        .logout-button {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            background: white;
            color: #222;
            cursor: pointer;
            font-size: 15px;
        }

        .logout-button:hover {
            background: #e8e8e8;
        }

        .dashboard-nav {
            background: #14532d;
            color: white;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .dashboard-nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        .dashboard-nav a:hover {
            text-decoration: underline;
        }

        .dashboard-nav button[data-view] {
            border: 0;
            background: transparent;
            color: white;
            font: inherit;
            font-size: 17px;
            cursor: pointer;
            padding: 0;
        }

        .dashboard-nav button[data-view]:hover,
        .dashboard-nav button[aria-current="page"] {
            text-decoration: underline;
        }

        .dashboard-view[hidden] { display: none; }

        .dashboard-embed {
            display: block;
            width: 100%;
            min-height: 850px;
            border: 0;
            background: #f4f6f9;
        }

        @media (max-width: 800px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-nav {
                gap: 16px;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="dashboard-nav">
        <button type="button" data-view="overview" aria-current="page">Dashboard</button>
        <button type="button" data-view="courses">My Courses</button>
        <button type="button" data-view="attendance">Attendance</button>
        <button type="button" data-view="students">Students</button>
        <button type="button" data-view="reports">Reports</button>

        <button
            type="button"
            class="logout-button"
            id="logoutButton">
            Logout
        </button>
    </nav>

    <main class="dashboard-container" id="dashboard">
      <div class="dashboard-view" data-panel="overview">
        <!-- Welcome section -->
        <header class="dashboard-header">
            <h1>Instructor Dashboard</h1>

            <p id="currentDate"></p>

            <p id="welcomeMessage">
                Welcome, Instructor!
            </p>

            <p
                id="pageMessage"
                class="status-message"
                role="status"
                aria-live="polite">
                Loading dashboard...
            </p>
        </header>

        <!-- Summary cards -->
        <section class="dashboard-grid" aria-label="Dashboard summary">
            <div class="dashboard-card">
                <h2>My Courses</h2>
                <p class="dashboard-number" id="courseCount">--</p>
            </div>

            <div class="dashboard-card">
                <h2>Instructor</h2>
                <p id="instructorName">--</p>
            </div>

            <div class="dashboard-card">
                <h2>Academic Term</h2>
                <p id="academicTerm">--</p>
            </div>
        </section>

        <!-- Courses section -->
        <section class="content-section" id="my-courses">
            <h2>My Courses</h2>

            <p>
                Select a course assigned to you to view its information.
            </p>

            <label for="courseSelect">
                <strong>Select a course</strong>
            </label>

            <select
                id="courseSelect"
                class="course-select">
                <option value="">Loading courses...</option>
            </select>
        </section>

        <!-- Selected course details -->
        <section class="content-section" id="course-details">
            <h2>Selected Course</h2>

            <p id="selectedCourseName">None</p>

            <div id="courseDetails" class="course-details">
                Choose a course to view its details.
            </div>
        </section>

      </div>
      <section class="content-section dashboard-view" data-panel="courses" hidden>
        <h2>My Courses</h2>
        <iframe class="dashboard-embed" title="Course management" src="/instructor/courses.html?embedded=1"></iframe>
      </section>
      <section class="content-section dashboard-view" data-panel="attendance" hidden>
        <h2>Attendance</h2>
        <iframe class="dashboard-embed" title="Attendance management" src="/instructor/attendance.html?embedded=1"></iframe>
      </section>
      <section class="content-section dashboard-view" data-panel="students" hidden>
        <h2>Students</h2>
        <iframe class="dashboard-embed" title="Student records" src="/instructor/students.html?embedded=1"></iframe>
      </section>
      <section class="content-section dashboard-view" data-panel="reports" hidden>
        <h2>Reports</h2>
        <iframe class="dashboard-embed" title="Attendance reports" src="/instructor/reports.html?embedded=1"></iframe>
      </section>
    </main>

    <!-- Login and dashboard setup -->
    <script>
        const instructorPageUser = JSON.parse(
            localStorage.getItem("user")
        );

        // Verify the logged-in user's role.
        if (
            !instructorPageUser ||
            instructorPageUser.role !== "instructor"
        ) {
            window.location.replace("/");
        } else {
            document.getElementById("welcomeMessage").textContent =
                `Welcome, ${instructorPageUser.name}!`;

            document.getElementById("instructorName").textContent =
                instructorPageUser.name;
        }

        // Display today's date.
        document.getElementById("currentDate").textContent =
            new Date().toLocaleDateString("en-US", {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });

        // Log out and return to the login page.
        document.getElementById("logoutButton").addEventListener(
            "click",
            function () {
                localStorage.removeItem("user");
                window.location.href = "/";
            }
        );

        const viewButtons = document.querySelectorAll("[data-view]");
        const viewPanels = document.querySelectorAll("[data-panel]");
        viewButtons.forEach((button) => button.addEventListener("click", () => {
            const selectedView = button.dataset.view;
            viewButtons.forEach((item) => {
                if (item.dataset.view === selectedView) item.setAttribute("aria-current", "page");
                else item.removeAttribute("aria-current");
            });
            viewPanels.forEach((panel) => {
                panel.hidden = panel.dataset.panel !== selectedView;
            });
        }));
    </script>

    <!-- Load instructor courses from the API -->
    <script src="/js/instructor.js"></script>
</body>
</html>
